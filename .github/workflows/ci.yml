name: Build & Performance Metrics

on:
  push:
    tags:
      - "release-v*"

permissions:
  contents: write

jobs:
  sovereign-build:
    name: Build & Extract Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Alpine Docker Image
        run: docker build -t systic-alpine -f .github/workflows/Dockerfile .

      - name: Run Pipeline (TESTING phase)
        # 1001:1001 is the default UID for the GitHub Actions runner user
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/workspace \
            systic-alpine \
            /bin/bash -c "chmod +x ./build.sh && ./build.sh Testing && chown -R 1001:1001 /workspace"

      - name: Upload Artifacts (Internal CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systic-transparency-reports
          path: |
            test_results.xml
            bench_results.json

      - name: Attach Hard Truth Reports to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            test_results.xml
            bench_results.json
          body: |
            ## Verification & Performance Reports

            The attached files are generated by the CI pipeline on the commit that produced this release tag — not curated, not cherry-picked.

            | File | Content |
            |---|---|
            | `test_results.xml` | GTest pass/fail results (JUnit format) |
            | `bench_results.json` | Google Benchmark timings |

            Benchmarks are run inside an Alpine container on a GitHub-hosted runner.
            Numbers reflect relative performance and build correctness — not bare-metal throughput.
            For absolute timing data, run `./run-build.sh Testing` on your own hardware.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
